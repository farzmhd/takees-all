<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1f4a"/>
      <stop offset="50%" stop-color="#19152b"/>
      <stop offset="100%" stop-color="#0e0f14"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0c29d"/>
      <stop offset="100%" stop-color="#d69b70"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4ecd8"/>
      <stop offset="100%" stop-color="#dfd2b5"/>
    </linearGradient>
    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a72fa"/>
      <stop offset="100%" stop-color="#5b2bb5"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Subtle Ambient Glow -->
  <circle cx="200" cy="180" r="140" fill="url(#purpleAccent)" opacity="0.25" filter="url(#softGlow)"/>

  <!-- Office/Studio Ambient Lines -->
  <line x1="40" y1="120" x2="360" y2="120" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="40" y1="240" x2="360" y2="240" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Character / Founder Figure -->
  <g transform="translate(0, 10)">
    <!-- Shoulders / Printed Linen Shirt -->
    <path d="M90 390 C90 310, 140 280, 200 280 C260 280, 310 310, 310 390 Z" fill="url(#shirtGrad)"/>
    <!-- Subtle shirt print pattern -->
    <circle cx="160" cy="330" r="4" fill="#a89270" opacity="0.6"/>
    <circle cx="240" cy="330" r="4" fill="#a89270" opacity="0.6"/>
    <circle cx="200" cy="350" r="5" fill="#a89270" opacity="0.6"/>
    <circle cx="140" cy="365" r="4" fill="#a89270" opacity="0.6"/>
    <circle cx="260" cy="365" r="4" fill="#a89270" opacity="0.6"/>
    <!-- Shirt Collar -->
    <path d="M170 280 L200 320 L160 300 Z" fill="#cfc2a3"/>
    <path d="M230 280 L200 320 L240 300 Z" fill="#bfb293"/>

    <!-- Neck -->
    <path d="M175 240 L225 240 L225 285 L175 285 Z" fill="#caa07a"/>

    <!-- Head / Face -->
    <ellipse cx="200" cy="205" rx="55" ry="65" fill="url(#skinGrad)"/>

    <!-- Well-groomed Beard & Mustache -->
    <path d="M152 205 C152 260, 248 260, 248 205 C248 245, 235 272, 200 272 C165 272, 152 245, 152 205 Z" fill="#231b26"/>
    <path d="M176 226 C190 220, 210 220, 224 226 C215 233, 185 233, 176 226 Z" fill="#18131b"/>

    <!-- Eyes and Eyebrows -->
    <path d="M168 185 Q180 180 190 186" stroke="#1d1620" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M210 186 Q220 180 232 185" stroke="#1d1620" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <circle cx="180" cy="196" r="4" fill="#1d1620"/>
    <circle cx="220" cy="196" r="4" fill="#1d1620"/>
    <circle cx="181" cy="195" r="1.5" fill="#ffffff"/>
    <circle cx="221" cy="195" r="1.5" fill="#ffffff"/>

    <!-- Nose -->
    <path d="M198 195 L196 215 L204 215" stroke="#b88358" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Hair -->
    <path d="M142 195 C140 140, 160 130, 200 130 C240 130, 260 140, 258 195 C255 170, 245 145, 200 145 C155 145, 145 170, 142 195 Z" fill="#1f1823"/>
    <path d="M150 160 C170 135, 230 135, 250 160 C235 145, 165 145, 150 160 Z" fill="#2b2331"/>

    <!-- Watch on wrist hint / pose detail -->
    <circle cx="105" cy="370" r="12" fill="#5b2bb5"/>
    <circle cx="105" cy="370" r="8" fill="#e0d6f5"/>
  </g>

  <!-- Founder Badge in Corner -->
  <g transform="translate(24, 24)">
    <rect width="105" height="28" rx="14" fill="rgba(91,43,181,0.7)" backdrop-filter="blur(10px)"/>
    <text x="52" y="18" fill="#ffffff" font-size="11" font-weight="700" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle" letter-spacing="0.5">FOUNDER</text>
  </g>
</svg>
